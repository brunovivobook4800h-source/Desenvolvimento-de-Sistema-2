<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Colaboradores</title>
</head>

<body>

    <h1>Cadastro de Colaboradores</h1>

    <form method="POST" action="phpcadastro.php">

        <label for="nome1">Nome completo:</label>
        <input type="text" name="nome1" id="nome1" required>
        <br><br>

        <label for="idade2">Idade:</label>
        <input type="number" name="idade2" id="idade2" required>
        <br><br>

        <label for="profissao3">Profissão:</label>
        <input type="text" name="profissao3" id="profissao3" required>
        <br><br>

        <label for="salario4">Salário pretendido:</label>
        <input type="number" name="salario4" id="salario4" step="0.01" required>
        <br><br>

        <label for="experiencia5">Experiência anterior:</label>
        <br>
        <textarea name="experiencia5" id="experiencia5" rows="6" cols="40" required></textarea>
        <br><br>

        <input type="submit" value="Cadastrar">

    </form>

    <footer>
        <p>Casas Bahia - Cadastro de Colaboradores</p>
    </footer>

</body>
</html>
