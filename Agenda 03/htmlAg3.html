<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promoção Madeira e Cia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Promoção Madeira e Cia</h1>

        <form action="desconto.php" method="POST">

        <label for="nome">Nome do cliente:</label>
        <input type="text" id="nome" name="txtNome" required>

        <label for="valor">Valor da compra:</label>
        <input type="number" id="valor" name="txtValorCompra" step="0.01" min="0" required>

        <label for="pagamento">Forma de pagamento:</label>
        <select id="pagamento" name="cmbPag" required>
            <option value="">Selecione uma opção</option>
            <option value="deposito">Depósito</option>
            <option value="boleto">Boleto</option>
            <option value="cartaoCredito">Cartão de crédito</option>
        </select>

        <button type="submit">Calcular desconto</button>

        </form>

    </div>

</body>

</html>
